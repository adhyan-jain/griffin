# Local development database. `make setup` starts it and applies the migrations.
# It matches the DATABASE_URL in .env.example. Not for production: use Supabase there.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: griffin_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - griffin-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d griffin_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  griffin-db:
