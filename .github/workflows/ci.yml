name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint-and-format:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Verify Go format (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "ERROR: Unformatted Go files detected:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: griffin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Verify go module dependencies
        run: go mod verify

      - name: Build server binary
        run: go build -v -o bin/griffin-server ./cmd/griffin-server

      - name: Cross-compile linux/arm64 (Lambda + EC2 worker)
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o bin/griffin-server-arm64 ./cmd/griffin-server
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o bin/griffin-migrate-arm64 ./cmd/griffin-migrate

      - name: Run automated test suite
        env:
          GRIFFIN_TEST_DB_URL: postgres://postgres:postgres@localhost:5432/griffin_test?sslmode=disable
        run: go test -v -count=1 ./...

  web:
    name: Web (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run
      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build
      - name: Dev login must be stripped from the production bundle
        run: |
          if grep -rl -e "Use dev login" -e "/api/v1/auth/login" .next/static; then
            echo "dev-login code leaked into the production bundle" >&2; exit 1
          fi

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: ./gradlew --no-daemon testDebugUnitTest
